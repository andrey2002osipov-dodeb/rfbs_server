name: docker

# При каждом пуше: проверки, тесты и сборка Docker-образа.
# Образ публикуется в GitHub Container Registry: ghcr.io/<владелец>/rfbs_server
#   :latest        — основная ветка репозитория (её ставим на OpenMediaVault)
#   :<версия>      — версия программы автора + номер сборки сервера, например 1.5.2-s1
#   :sha-<коммит>  — каждая сборка, чтобы можно было откатиться

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.mod

      - name: Проверки и тесты
        working-directory: app
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Файлы не отформатированы (gofmt)"; exit 1; }
          go vet ./...
          go test ./...

      - name: Версия
        run: |
          echo "APP_VERSION=$(tr -d ' \r\n' < app/VERSION)" >> "$GITHUB_ENV"
          echo "SERVER_VERSION=$(tr -d ' \r\n' < SERVER_VERSION)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.APP_VERSION }}-s${{ env.SERVER_VERSION }},enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Ozon rFBS (сервер)
            org.opencontainers.image.version=${{ env.APP_VERSION }}-s${{ env.SERVER_VERSION }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Проверка образа
        run: |
          docker run -d --name rfbs-check -p 8766:8766 -e OZON_RFBS_ADMIN_USER=admin -e OZON_RFBS_ADMIN_PASSWORD=checkpass1 "${IMAGE}:sha-${GITHUB_SHA::7}"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/api/ping && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8766/api/state)
          test "$code" = 401 || { echo "без входа ожидался 401, получено $code"; exit 1; }
          curl -fsS -c c.txt -H 'Content-Type: application/json' -d '{"user":"admin","password":"checkpass1"}' http://127.0.0.1:8766/api/login
          curl -fsS -b c.txt http://127.0.0.1:8766/api/state | grep -q '"server":true'
          docker exec rfbs-check sh -c 'ls -ln /data && test -f /data/users.json'
          docker logs rfbs-check
